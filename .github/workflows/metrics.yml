name: Collect metrics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out metrics branch
        run: |
          if git ls-remote --exit-code --heads origin metrics; then
            git fetch origin metrics:metrics
            git worktree add metrics-data metrics
          else
            git worktree add --orphan -b metrics metrics-data
          fi

      - name: Collect metrics
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node scripts/collect-metrics.mjs metrics-data

      - name: Commit metrics
        working-directory: metrics-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update metrics for $(date -u +%F)"
            git push origin metrics
          fi
